<style>

  .us-double{text-decoration-style:double; text-decoration-thickness:.07em;} .us-wavy{text-decoration-style:wavy; text-decoration-thickness:.06em;} .us-dotted{text-decoration-style:dotted; text-decoration-thickness:.12em;}

  body.lector{

  #lector{min-height:100dvh; display:flex; flex-direction:column; background:var(--rbg); color:var(--rink); font-family:var(--f-body); -webkit-text-size-adjust:100%;}

  .rsheet-head .rlbl{margin:0; font-size:13px; color:var(--rsoft); width:100%;}
  .rsheet-head select{flex:1; min-width:0; font:16px var(--f-body); padding:8px; min-height:44px; background:var(--rsurface); color:var(--rink); border:1px solid var(--rline); border-radius:8px;}
  .rsheet-head button{font-weight:600; font-size:15px; min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--rline); background:transparent; color:var(--rink); margin-left:auto;}
  #rList{list-style:none; margin:0; padding:0;}

  #rList button .rr{font-weight:600; flex:none; font-variant-numeric:tabular-nums;}
  #rList button .rw{color:var(--rsoft); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0;}
  #rList button[aria-current="true"]{border-left-color:var(--raccent); background:var(--rsurface);}
  @media (min-width:701px){

    .rnav{justify-content:center;} .rnav button{flex:0 1 260px;}
  }

<script>
const DATA = {"clase": "Práctico 9 (08.10)", "pasajes": [{"id": "aTuc-dides-2-37-1-Epitafio-de-Pericles-", "ref": "Tucídides 2.37.1 (Epitafio de Pericles)", "lines": ["χρώμεθα γὰρ πολιτείᾳ οὐ ζηλούσῃ τοὺς τῶν πέλας νόμους."], "trans": "Tenemos, en efecto, un régimen político que no envidia las leyes de los vecinos.", "gloss": "<div><b>γάρ:<\/b> pues<\/div><div><b>ζηλόω, -ῶ:<\/b> envidiar, emular<\/div><div><b>νόμος, -ου: ὁ.<\/b> ley<\/div><div><b>οὐ:<\/b> no<\/div><div><b>πέλας (adv.):<\/b> cerca; (οἱ πέλας) los vecinos, los demás<\/div><div><b>πολιτεία, -ας: ἡ.<\/b> régimen político, constitución<\/div><div><b>χράομαι, -ῶμαι (+ dat.):<\/b> usar, servirse de; tener<\/div>", "notes": "<ul><li>participio presente activo de -όω&nbsp;<\/li><li>χράομαι + dativo<\/li><li>artículo + adverbio sustantivado (τῶν πέλας)<\/li><\/ul>", "ctx": "Es la primera frase de la célebre definición de la democracia ateniense. Sigue: παράδειγμα δὲ μᾶλλον αὐτοὶ ὄντες τισὶν ἢ μιμούμενοι ἑτέρους («siendo nosotros más bien modelo para algunos que imitadores de otros»).", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aOdisea-6-221-222", "ref": "Odisea 6.221-222", "lines": ["αἰδέομαι γὰρ γυμνοῦσθαι."], "trans": "Pues me da vergüenza desnudarme.", "gloss": "<div><b>αἰδέομαι:<\/b> sentir vergüenza, avergonzarse; respetar<\/div><div><b>γάρ:<\/b> pues<\/div><div><b>γυμνόω, -ῶ:<\/b> desnudar; (med.) desnudarse<\/div>", "notes": "<ul><li>infinitivo presente medio de -όω<\/li><li>αἰδέομαι + infinitivo<\/li><li>forma no contracta épica (αἰδέομαι = ático αἰδοῦμαι): sirve para repasar la contracción en -έω<\/li><\/ul>", "ctx": "Odiseo, náufrago y desnudo, les pide a las criadas de Nausícaa que se aparten mientras se baña en el río: ἄντην δ᾽ οὐκ ἂν ἐγώ γε λοέσσομαι· αἰδέομαι γὰρ / γυμνοῦσθαι («delante de ustedes no me voy a bañar»).", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aOdisea-22-1", "ref": "Odisea 22.1", "lines": ["αὐτὰρ ὁ γυμνώθη ῥακέων πολύμητις Ὀδυσσεύς."], "trans": "Y entonces se despojó de los harapos el muy astuto Odiseo.", "gloss": "<div><b>αὐτάρ:<\/b> pero, y entonces<\/div><div><b>γυμνόω, -ῶ:<\/b> desnudar; (pas. + gen.) despojarse de<\/div><div><b>ὁ, ἡ, τό (valor pronominal):<\/b> él, ella<\/div><div><b>Ὀδυσσεύς, -έως: ὁ.<\/b> Odiseo<\/div><div><b>πολύμητις, -ιος:<\/b> muy astuto, de muchos recursos, muchas vueltas&nbsp;<\/div><div><b>ῥάκος, -ους: τό.<\/b> harapo<\/div>", "notes": "<ul><li>aoristo pasivo de -όω (sin aumento, griego homérico)<\/li><li>genitivo de separación cf. Ablativo<\/li><li>ὁ con valor demostrativo/anafórico<\/li><li>ῥακέων no contracto (griego homérico)<\/li><\/ul>", "ctx": "Primer verso del canto 22. Odiseo, que llevaba los harapos de mendigo desde el canto 13, se los quita y salta al umbral con el arco: empieza la matanza de los pretendientes.", "hl": {"3": "y"}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aMenandro-Mon-sticos-831-J-kel-545-Meineke-", "ref": "Menandro, Monósticos 831 Jäkel (= 545 Meineke)", "lines": ["χρόνος δ᾽ ἀμαυροῖ πάντα κεἰς λήθην ἄγει."], "trans": "Pues el tiempo borra todo y (todo) lo lleva al olvido.<br>Pues el tiempo borra todas las cosas y las lleva al olvido.&nbsp;", "gloss": "<div><b>ἄγω:<\/b> conducir, llevar<\/div><div><b>ἀμαυρόω, -ῶ:<\/b> oscurecer, borrar<\/div><div><b>δέ:<\/b> pero, y<\/div><div><b>εἰς (+ acus.):<\/b> a, hacia<\/div><div><b>καί:<\/b> y (en crasis: κεἰς = καὶ εἰς)<\/div><div><b>λήθη, -ης: ἡ.<\/b> olvido<\/div><div><b>πᾶς, πᾶσα, πᾶν:<\/b> todo<\/div><div><b>χρόνος, -ου: ὁ.<\/b> tiempo<\/div>", "notes": "<ul><li>presente de -όω (ο + ει → οι)<\/li><li>crasis (κεἰς = καὶ εἰς)<\/li><\/ul>", "ctx": "Sentencia sobre el tiempo. Está documentada en la colección de Monósticos atribuidos a Menandro (<i>Sententiae<\/i>, 831 Jäkel). También atribuida a Sófocles (fr. 954 Radt, incertae fabulae).", "hl": {"4": "g"}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aS-focles-Ant-gona-543", "ref": "Sófocles, Antígona 543", "lines": ["λόγοις δ᾽ ἐγὼ φιλοῦσαν οὐ στέργω φίλην."], "trans": "Pero yo no quiero a una amiga que ama con palabras<br>Pero yo no quiero a una amiga que quiere de palabra/de la boca para afuera.&nbsp;", "gloss": "<div><b>δέ:<\/b> pero, y<\/div><div><b>ἐγώ:<\/b> yo<\/div><div><b>λόγος, -ου: ὁ.<\/b> palabra, discurso<\/div><div><b>οὐ:<\/b> no<\/div><div><b>στέργω:<\/b> querer, sentir afecto por<\/div><div><b>φιλέω, -ῶ:<\/b> amar, querer<\/div><div><b>φίλος, -η, -ον:<\/b> amigo; (sust.) amigo, amiga<\/div>", "notes": "<ul><li>participio presente activo de -έω<\/li><li>dativo instrumental<\/li><li>φιλέω / στέργω (dos tipos de amor)<\/li><li>figura etimológica φιλοῦσαν… φίλην<\/li><\/ul>", "ctx": "Ismene quiere compartir la condena de Antígona después de haberse negado a ayudarla a enterrar a Polinices. Antígona la rechaza.", "hl": {}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aEur-pides-Medea-326", "ref": "Eurípides, Medea 326", "lines": ["ἀλλ᾽ ἐξελᾷς με κοὐδὲν αἰδέσῃ λιτάς;"], "trans": "¿Pero me vas a echar sin considerar en nada mis súplicas?", "gloss": "<div><b>αἰδέομαι (fut. αἰδέσομαι):<\/b> respetar, tener consideración por<\/div><div><b>ἀλλά:<\/b> sino, pero; (en pregunta) ¿entonces…?<\/div><div><b>ἐγώ (acus. με):<\/b> yo<\/div><div><b>ἐξελαύνω (fut. ἐξελῶ):<\/b> expulsar, echar<\/div><div><b>καί:<\/b> y (en crasis: κοὐδέν = καὶ οὐδέν)<\/div><div><b>λιτή, -ῆς: ἡ.<\/b> súplica<\/div><div><b>οὐδείς, οὐδεμία, οὐδέν:<\/b> nadie, ninguno; (οὐδέν adv.) en nada<\/div>", "notes": "<ul><li>futuro contracto (ἐλῶ, -ᾷς)<\/li><li>futuro medio<\/li><li>crasis κοὐδέν<\/li><li>οὐδέν como acusativo adverbial<\/li><\/ul>", "ctx": "Creonte acaba de decretar el destierro de Medea y ella le suplica de rodillas.", "hl": {"3": "g"}, "fx": {}, "ul": {}, "lk": {}}, {"id": "aLas-ltimas-palabras-de-Bruto-Di-n-Casio-47-49-2-", "ref": "Las últimas palabras de Bruto (Dión Casio 47.49.2)", "lines": ["ὦ τλῆμον Ἀρετή, λόγος ἄρ᾽ ἦσθ᾽, ἐγὼ δέ σε ὡς ἔργον ἤσκουν."], "trans": "¡Oh, desdichada Virtud!, entonces eras una palabra, y yo te practicaba como una realidad.", "gloss": "<d rq('rLat').addEventListener('touchstart', e => { if(e.touches.length === 1) sw = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive:true});
rq('rLat').addEventListener('touchend', e => {
  if(!sw) return; const s = sw; sw = null; const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
  if(Date.now() - s.t > 700 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) / 2 || !getSelection().isCollapsed) return;
  go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ rq('rSheet').hidden = true; return; }
  if(!rq('rSheet').hidden) return;
  if(e.key === 'ArrowRight') go(idx + 1); else if(e.key === 'ArrowLeft') go(idx - 1);
});
applyPrefs(); render();
</script>
</body></html>
