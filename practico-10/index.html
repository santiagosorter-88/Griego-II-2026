<script>
const DATA = {"clase": "Práctico 10 (15.10)", "pasajes": [{"id": "aPlat-n-Banquete-201c", "ref": "Platón, Banquete 201c", "lines": ["εἰ ἄρα ὁ Ἔρως τῶν καλῶν ἐνδεής ἐστιν, τὰ δὲ ἀγαθὰ καλά, καὶ τῶν ἀγαθῶν ἐνδεής ἐστιν."], "trans": "<mark class=\"c-y\">Entonces<\/mark>, si Eros carece de las cosas bellas, y las cosas buenas son bellas, también carece de las cosas buenas.", "gloss": "<div><b>ἀγαθός, -ή, -όν:<\/b> bueno<\/div><div><b>ἄρα:<\/b> entonces, por consiguiente<\/div><div><b>δέ:<\/b> pero, y<\/div><div><b>εἰ:<\/b> si<\/div><div><b>εἰμί:<\/b> ser, haber<\/div><div><b>ἐνδεής, -ές (+ gen.):<\/b> carente de, necesitado de<\/div><div><b><mark class=\"c-y\">Ἔρως<\/mark>, -ωτος: ὁ.<\/b> Eros, Amor<\/div><div><b>καί:<\/b> también<\/div><div><b>καλός, -ή, -όν:<\/b> bello, hermoso<\/div>", "notes": "<ul><li>proposición condicional (εἰ + indicativo) Prótasis (Adverbial?)<\/li><li>usos del genitivo<\/li><li>adjetivos de 2ª clase (ἐνδεής)<\/li><\/ul>", "ctx": "Vamos a la marcha aunque <mark class=\"c-g\">llueva<\/mark> (eventual)<br>Vamos a la marcha aunque <mark class=\"c-r\">llueve<\/mark> (real)<br>Hubiera ido a la marcha aunque <mark class=\"c-y\">hubiera<\/mark> llovido (irreal)<br><br><br>Sócrates refuta a Agatón, que acaba de elogiar a Eros como el más bello de los dioses. Si Eros desea lo bello, carece de lo bello; y como lo bueno es bello, también carece de lo bueno. Agatón termina admitiendo que no sabía lo que decía.", "hl": {"9": "y"}, "fx": {}, "ul": {"0": "k-wavy", "1": "k-wavy", "2": "k-wavy", "3": "k-wavy", "4": "k-wavy", "5": "k-wavy", "6": "k-wavy", "7": "k-wavy", "8": "k-wavy", "9": "k-wavy", "10": "k-wavy", "11": "k-wavy"}, "lk": {}}, {"id": "aPlat-n-Prot-goras-310a", "ref": "Platón, Protágoras 310a", "lines": ["τί οὖν οὐ διηγήσω ἡμῖν τὴν ξυνουσίαν, εἰ μή σέ τι κωλύει;"], "trans": "¿Por qué no nos contás, <mark class=\"c-y\">entonces<\/mark>, la reunión, si nada te (lo impide?", "gloss": "<div><b>διηγέομαι, -οῦμαι:<\/b> narrar, contar<\/div><div><b>ἐγώ (   rq('rTab').innerHTML = !k ? '' : k === 'gloss' ? sortGloss(t.gloss) : t[k];
}
function go(i){ i = Math.max(0, Math.min(P.length - 1, i)); if(i === idx) return; idx = i; store.set('pid', P[idx].id); render(); window.scrollTo(0, 0); }
function openSheet(){
  rq('rSheetLbl').textContent = DATA.clase + ' · ' + P.length + ' pasajes';
  rq('rList').innerHTML = P.map((t, j) => `<li><button data-j="${j}"${j === idx ? ' aria-current="true"' : ''}><span class="rr">${esc(t.ref)}</span><span class="rw" lang="grc">${esc((t.lines[0] || '').split(/\s+/).slice(0, 6).join(' '))}</span></button></li>`).join('');
  rq('rSheet').hidden = false;
  const c = rq('rList').querySelector('[aria-current]'); if(c) c.scrollIntoView({block:'center'});
}
rq('rSel').remove();
rq('rPrev').onclick = () => go(idx - 1);
rq('rNext').onclick = () => go(idx + 1);
rq('rRef').onclick = openSheet;
rq('rSheetClose').onclick = () => { rq('rSheet').hidden = true; };
rq('rSheet').addEventListener('click', e => {
  if(e.target === e.currentTarget){ rq('rSheet').hidden = true; return; }
  const b = e.target.closest('[data-j]'); if(b){ rq('rSheet').hidden = true; go(+b.dataset.j); }
});
rq('rTabs').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(!b) return; tabSel = b.dataset.k; store.set('tab', tabSel); render(); });
rq('rMinus').onclick = () => { fs = Math.max(16, fs - 2); store.set('fs', fs); applyPrefs(); };
rq('rPlus').onclick = () => { fs = Math.min(30, fs + 2); store.set('fs', fs); applyPrefs(); };
rq('rThemeBtn').onclick = () => { const dark = getComputedStyle(document.body).colorScheme.includes('dark'); store.set('theme', dark ? 'light' : 'dark'); applyPrefs(); };
const openUrl = u => { u = safeUrl(u); if(u){ try { window.open(u, '_blank', 'noopener'); } catch(e){} } };
rq('rTab').addEventListener('click', e => { const a = e.target.closest('a'); if(a){ e.preventDefault(); openUrl(a.getAttribute('href')); } });
rq('rLat').addEventListener('click', e => { const w = e.target.closest('.w.lk'); if(w && getSelection().isCollapsed) openUrl(P[idx].lk[w.dataset.i]); });
let sw = null;
rq('rLat').addEventListener('touchstart', e => { if(e.touches.length === 1) sw = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()}; }, {passive:true});
rq('rLat').addEventListener('touchend', e => {
  if(!sw) return; const s = sw; sw = null; const p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
  if(Date.now() - s.t > 700 || Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) / 2 || !getSelection().isCollapsed) return;
  go(idx + (dx < 0 ? 1 : -1));
}, {passive:true});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ rq('rSheet').hidden = true; return; }
  if(!rq('rSheet').hidden) return;
  if(e.key === 'ArrowRight') go(idx + 1); else if(e.key === 'ArrowLeft') go(idx - 1);
});
applyPrefs(); render();
</script>
</body></html>
